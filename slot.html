<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="https://use.typekit.net/etu8ort.css" id="adobe-typekit-fonts">
    <title>もうどくスロット</title>
    <style>
        body {
            background-color: #000;
            color: #39ff14;
            font-family: 'Courier New', Courier, monospace, fantasy;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .casino-frame {
            border: 5px double #39ff14;
            padding: 40px;
            background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 20px #39ff14;
            text-align: center;
            border-radius: 20px;
        }
        .reels {
            display: flex;
            gap: 20px;
            font-size: 80px;
            margin: 30px 0;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
        }
        .point-display {
            font-size: 24px;
            margin-bottom: 10px;
        }
        button {
            background: #39ff14;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b8a0a;
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status-msg { margin-top: 20px; height: 24px; color: #ff00ff; }
    </style>
    <link rel="stylesheet" href="halloween.css">
</head>
<body>

<div class="casino-frame">
    <h1>☣️ MOU-DOKU SLOT ☣️</h1>
    <div class="point-display">所持金: <span id="pt-val">---</span> pt</div>
    
    <div class="reels">
        <div id="r1">💀</div>
        <div id="r2">💀</div>
        <div id="r3">💀</div>
    </div>

    <button id="spinBtn" onclick="runSlot()">SPIN (100pt)</button>
    <div id="status-msg"></div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyCNH7nojIIXwwDqmnRBf6YTMdVAohZG14KShr0Bnms-fYo5GukyJ5l2XuztOU7BZF7/exec";
    const userId = localStorage.getItem("userId"); 
    const symbols = ['💀', '☣️', '🧪', '🩸', '💎', '7️⃣'];

    // --- 1. ポイントだけをロードする関数 ---
    async function loadPoints() {
        if (!userId) {
            document.getElementById('status-msg').innerText = "ログイン情報が見つからないぜ。";
            return;
        }
        try {
            // GAS側にポイント確認用のaction（checkPlanやgetUserDataなど）がある想定
            // なければ今回のslotSpinの引数調整などで対応可能
            const res = await fetch(`${GAS_URL}?action=checkPlan&name=${userId}`);
            const data = await res.json();
            // GAS側から「point」という名前で返ってくる想定
            if (data.point !== undefined) {
                document.getElementById('pt-val').innerText = data.point;
            } else if (data.newPoint !== undefined) {
                document.getElementById('pt-val').innerText = data.newPoint;
            }
        } catch (e) {
            console.error("ポイントロード失敗:", e);
        }
    }

    // --- 2. ページ読み込み時に実行 ---
    window.onload = loadPoints;

    async function runSlot() {
        const btn = document.getElementById('spinBtn');
        const msg = document.getElementById('status-msg');
        btn.disabled = true;
        msg.innerText = "通信中...";

        try {
            const res = await fetch(`${GAS_URL}?action=slotSpin&name=${userId}`);
            const data = await res.json();

            if (!data.success) {
                msg.innerText = data.msg;
                btn.disabled = false;
                return;
            }

            // 演出開始
            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('r1').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                document.getElementById('r2').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                document.getElementById('r3').innerText = symbols[Math.floor(Math.random()*symbols.length)];
                count++;

                if (count > 20) {
                    clearInterval(timer);
                    // 結果反映
                    const resultSym = data.win ? (data.item === '777' ? '7️⃣' : '💎') : '💀';
                    document.getElementById('r1').innerText = resultSym;
                    document.getElementById('r2').innerText = resultSym;
                    document.getElementById('r3').innerText = data.win ? resultSym : '🧪';
                    
                    // --- 3. スロット終了時に最新ポイントを反映 ---
                    document.getElementById('pt-val').innerText = data.newPoint;
                    msg.innerText = data.win ? `🎉 当たり！ ${data.payout}pt獲得！` : "ハズレ...";
                    btn.disabled = false;
                    
                    // 念のため少し後に全体ロードもかけて同期を確実にする
                    setTimeout(loadPoints, 1000);
                }
            }, 50);

        } catch (e) {
            msg.innerText = "エラーが発生したぜ。";
            btn.disabled = false;
        }
    }
</script>
<script id="halloween-font-activation">
(function () {
  const applyAdobeFont = () => {
    try {
      const faces = Array.from(document.fonts || []);
      const ignored = /^(Arial|Helvetica|Helvetica Neue|Times New Roman|Courier New|serif|sans-serif|monospace|DotGothic16|Noto Sans JP)$/i;
      const family = faces.map(face => String(face.family || '').replace(/^['\"]|['\"]$/g, '').trim())
        .find(name => name && !ignored.test(name));
      if (family) {
        const safe = family.replace(/[\"\\]/g, '');
        document.documentElement.style.setProperty('--brand-font', '"' + safe + '", "Yu Gothic UI", "Meiryo", sans-serif');
      }
    } catch (_) { /* The CSS fallback remains available if the font kit cannot be inspected. */ }
  };
  const kit = document.getElementById('adobe-typekit-fonts');
  if (kit) kit.addEventListener('load', applyAdobeFont, { once: true });
  if (document.readyState === 'complete') applyAdobeFont();
  else window.addEventListener('load', applyAdobeFont, { once: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyAdobeFont);
})();
</script>
</body>
</html>
