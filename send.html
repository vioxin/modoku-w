<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://use.typekit.net/etu8ort.css" id="adobe-typekit-fonts">
    <title>リモート・プロセスキラー</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: white; display: flex; justify-content: center;}
        .card { background: #2d2d2d; padding: 25px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #aaa; }
        select { width: 100%; padding: 10px; background: #121212; border: 1px solid #444; color: #00ff00; font-size: 16px; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #d32f2f; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-reload { background: #2196f3; margin-bottom: 20px; padding: 10px;}
        .btn-reload:hover { background: #1976d2; }
        #response { margin-top: 15px; color: #4caf50; font-weight: bold; min-height: 40px; word-break: break-all; }
    </style>
    <link rel="stylesheet" href="halloween.css">

    <link rel="stylesheet" href="modoku-common.css">
    <script src="modoku-common.js"></script>
</head>
<body>

<div class="card">
    <h2>🎯 リモート管理パネル</h2>
    
    <div class="input-group">
        <label for="pc-select">対象のPCを選択</label>
        <select id="pc-select">
            <option value="">読込中...</option>
        </select>
    </div>
    
    <button id="reload-btn" class="btn-reload">🔄 リストを最新に更新</button>

    <button id="kill-btn">Edgeを強制終了 (KILL)</button>

    <div id="response">準備完了。</div>
</div>

<script type="py">
import json
from pyodide.ffi import create_proxy
from pyodide.http import pyfetch
from js import document

# 🔴 【重要】ステップ1で取得したGASのウェブアプリURLをここに貼り付けます
GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwC_UQzScXj9qAB0b4EzCI9fwfdPS-Wx88bYcQiPNSPbKlov6JAePGX-0JNlVtHNWyh/exec"

# --- GASからPCリストを取得してプルダウンを作成する関数 ---
async def load_pc_list(event=None):
    select_el = document.getElementById("pc-select")
    btn_reload = document.getElementById("reload-btn")
    res_div = document.getElementById("response")
    
    btn_reload.disabled = True
    select_el.innerHTML = '<option value="">GASから取得中...</option>'
    
    try:
        # GASへGETリクエストを送り、JSONデータを取得
        response = await pyfetch(GAS_WEBAPP_URL, method="GET")
        data = await response.json()
        
        select_el.innerHTML = "" # 中身をクリア
        
        if not data:
            select_el.innerHTML = '<option value="">稼働中のPCがありません</option>'
            return

        # 取得したデータをプルダウンに追加
        for pc in data:
            option = document.createElement("option")
            option.value = pc["url"] + "/api/command"  # ここで自動的に /api/command を付与！
            option.text = f"{pc['pc_name']}"
            select_el.appendChild(option)
            
        res_div.innerText = "リストを更新しました。"
        res_div.style.color = "#4caf50"
            
    except Exception as e:
        select_el.innerHTML = '<option value="">取得エラー</option>'
        res_div.innerText = f"リストの取得に失敗しました。\n{str(e)}"
        res_div.style.color = "#f44336"
    finally:
        btn_reload.disabled = False


# --- キル指令を送信する関数 ---
async def send_kill_command(event):
    btn = document.getElementById("kill-btn")
    res_div = document.getElementById("response")
    select_el = document.getElementById("pc-select")
    
    target_url = select_el.value
    
    if not target_url:
        res_div.innerText = "エラー: 対象のPCが選択されていません。"
        res_div.style.color = "#f44336"
        return

    btn.disabled = True
    res_div.innerText = f"送信中...\n宛先: {target_url}"
    res_div.style.color = "#ffeb3b"

    payload = {"instruction": "kill_edge"}

    try:
        response = await pyfetch(
            target_url,
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps(payload)
        )

        if response.ok:
            data = await response.json()
            res_div.innerText = data["message"]
            res_div.style.color = "#4caf50"
        else:
            res_div.innerText = f"通信エラー: {response.status}\nPCがオフラインの可能性があります。"
            res_div.style.color = "#f44336"
            
    except Exception as e:
        res_div.innerText = f"接続エラー: PCに到達できません。\n(ngrokが起動していない可能性があります)"
        res_div.style.color = "#f44336"
        
    finally:
        btn.disabled = False

# イベントの登録
document.getElementById("reload-btn").addEventListener("click", create_proxy(load_pc_list))
document.getElementById("kill-btn").addEventListener("click", create_proxy(send_kill_command))

# ページ読み込み時に自動でリストを取得する
import asyncio
asyncio.ensure_future(load_pc_list())
</script>

<script id="halloween-font-activation">
(function () {
  const applyAdobeFont = () => {
    try {
      const faces = Array.from(document.fonts || []);
      const ignored = /^(Arial|Helvetica|Helvetica Neue|Times New Roman|Courier New|serif|sans-serif|monospace|DotGothic16|Noto Sans JP)$/i;
      const family = faces.map(face => String(face.family || '').replace(/^['\"]|['\"]$/g, '').trim())
        .find(name => name && !ignored.test(name));
      if (family) {
        const safe = family.replace(/[\"\\]/g, '');
        document.documentElement.style.setProperty('--brand-font', '"' + safe + '", "Yu Gothic UI", "Meiryo", sans-serif');
      }
    } catch (_) { /* The CSS fallback remains available if the font kit cannot be inspected. */ }
  };
  const kit = document.getElementById('adobe-typekit-fonts');
  if (kit) kit.addEventListener('load', applyAdobeFont, { once: true });
  if (document.readyState === 'complete') applyAdobeFont();
  else window.addEventListener('load', applyAdobeFont, { once: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyAdobeFont);
})();
</script>
</body>
</html>
