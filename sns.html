function localSnapshot(args={}){
  const rawPosts=[...(data.posts||[])];
  const me=currentUser.id;
  const nowDate=new Date();
  const scheduledPosts=rawPosts.filter(p=>p.userId===me&&p.scheduledAt&&new Date(p.scheduledAt)>nowDate);
  const duePosts=rawPosts.filter(p=>!p.scheduledAt||new Date(p.scheduledAt)<=nowDate);
  const blocked=(data.blocks||[]).filter(x=>x.userId===me).map(x=>x.targetId);
  const muted=(data.mutes||[]).filter(x=>x.userId===me).map(x=>x.targetId);
  const myFollows=(data.follows||[]).filter(x=>x.userId===me).map(x=>x.targetId);
  const visiblePosts=duePosts.filter(p=>
    !blocked.includes(p.userId)&&!blocked.includes(p.authorId)&&
    !muted.includes(p.userId)&&!muted.includes(p.authorId)&&
    (!(data.settings||{})[p.userId]?.private||p.userId===me||myFollows.includes(p.userId))
  ).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const countFor=(arr,pid)=>arr.filter(x=>x.postId===pid).length;
  const allHydrated=visiblePosts.map(p=>({
    ...p,
    liked:(data.likes||[]).some(x=>x.userId===me&&x.postId===p.id),
    bookmarked:(data.bookmarks||[]).some(x=>x.userId===me&&x.postId===p.id),
    reposted:(data.reposts||[]).some(x=>x.userId===me&&x.postId===p.id),
    likeCount:countFor(data.likes||[],p.id)+(p.likes||0),
    repostCount:countFor(data.reposts||[],p.id)+(p.reposts||0),
    replyCount:visiblePosts.filter(x=>x.replyTo===p.id).length+(p.replyCount||0),
    pollVoted:(data.pollVotes||[]).some(x=>x.userId===me&&x.postId===p.id)
  }));
  let timeline=[...visiblePosts];
  if(args.mode==='following')timeline=timeline.filter(p=>p.userId===me||myFollows.includes(p.userId));
  if(args.listId){const l=(data.lists||[]).find(x=>x.id===args.listId&&x.userId===me);const allowed=[me,...(l?.members||[])];timeline=timeline.filter(p=>allowed.includes(p.userId));}
  if(args.community)timeline=timeline.filter(p=>p.community===args.community);
  const timelineIds=new Set(timeline.map(p=>p.id));
  const timelineHydrated=allHydrated.filter(p=>timelineIds.has(p.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const target=args.profileId||me;
  const profSetting=(data.settings||{})[target]||{};
  const targetPosts=allHydrated.filter(p=>p.userId===target).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const followers=(data.follows||[]).filter(x=>x.targetId===target).length;
  const following=(data.follows||[]).filter(x=>x.userId===target).length;
  const trends={};
  allHydrated.forEach(p=>{(String(p.text||'').match(/#[\p{L}\p{N}_]+/gu)||[]).forEach(tag=>trends[tag]=(trends[tag]||0)+1)});
  const users={};
  allHydrated.forEach(p=>{users[p.userId]={id:p.userId,name:p.userName||p.userId,bio:(data.settings||{})[p.userId]?.bio||'',avatar:(data.settings||{})[p.userId]?.avatar||''}});
  users[me]={id:me,name:currentUser.name,bio:profSetting.bio||'',avatar:profSetting.avatar||''};
  const bookmarkIds=(data.bookmarks||[]).filter(x=>x.userId===me).map(x=>x.postId);
  return {
    posts:timelineHydrated,explorePosts:allHydrated,bookmarkedPosts:allHydrated.filter(p=>bookmarkIds.includes(p.id)),scheduledPosts,
    blockedIds:blocked,mutedIds:muted,
    notifications:(data.notifications||[]).filter(n=>n.userId===me).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,50),
    bookmarkIds,followingIds:myFollows,users,
    profile:{id:target,name:users[target]?.name||(target===me?currentUser.name:target),bio:profSetting.bio||users[target]?.bio||'',avatar:profSetting.avatar||'',banner:profSetting.banner||'',followers,following,private:!!profSetting.private,posts:targetPosts},
    messages:(data.messages||[]).filter(m=>m.fromId===me||m.toId===me).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)),
    lists:(data.lists||[]).filter(l=>l.userId===me),
    communities:(data.communities||[]).map(c=>({...c,members:(c.members||[]).length})),
    joinedCommunities:(data.communityMembers||[]).filter(x=>x.userId===me).map(x=>x.communityId),
    trends:Object.entries(trends).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([tag,count])=>({tag,count})),
    settings:profSetting,drafts:(data.drafts||[]).filter(d=>d.userId===me)
  };
}
async function api(action,payload={}){
  const apiUrl=configuredApiUrl();
  const body={action,userId:currentUser.id,userName:currentUser.name,...payload};
  if(apiUrl){
    try{
      const r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const result=await r.json();
      if(result&&result.success===false)throw new Error(result.message||result.error||'APIエラー');
      serverMode=true;
      return result;
    }catch(e){serverMode=false;throw new Error('共有SNSサーバーと通信できません: '+(e.message||e));}
  }
  if(action!=='snapshot'&&currentUser.id!=='local-demo-user') showToast('共有サーバー未設定のため、この操作はこの端末にだけ保存されます。管理者は sns-config.js を設定してください。');
  return localAction(action,payload);
}

function localAction(action,p={}){const me=currentUser.id;switch(action){case'snapshot':return localSnapshot(p);case'createPost':{const post={id:uid(),userId:me,userName:currentUser.name,text:String(p.text||''),createdAt:now(),media:p.media||[],poll:p.poll||null,replyTo:p.replyTo||null,quoteOf:p.quoteOf||null,community:p.community||'',scheduledAt:p.scheduledAt||'',likes:0,reposts:0,views:0};if(p.draft){data.drafts.unshift({...post,userId:me});saveLocal();return {success:true,draft:post}}data.posts.unshift(post);if(post.replyTo){const orig=data.posts.find(x=>x.id===post.replyTo);if(orig)notify(orig.userId,'reply',currentUser,orig.id,'あなたの投稿に返信しました');}notifyMentions(post);saveLocal();return {success:true,post};}

case'follow':{const i=(data.follows||[]).findIndex(x=>x.userId===me&&x.targetId===p.targetId);if(i>=0)data.follows.splice(i,1);else{data.follows.unshift({id:uid(),userId:me,targetId:p.targetId,createdAt:now()});notify(p.targetId,'follow',currentUser,'','フォローしました');}saveLocal();return {success:true,following:i<0}}
case'votePoll':{if((data.pollVotes||[]).some(x=>x.userId===me&&x.postId===p.postId))throw Error('この投票には回答済みです');const post=data.posts.find(x=>x.id===p.postId);if(!post||!post.poll)throw Error('投票が見つかりません');const opt=post.poll.options[p.optionIndex];if(!opt)throw Error('選択肢が見つかりません');opt.votes=opt.votes||[];opt.votes.push(me);data.pollVotes.unshift({id:uid(),userId:me,postId:p.postId,optionIndex:p.optionIndex});saveLocal();return {success:true}}
case'saveProfile':{data.settings=data.settings||{};data.settings[me]={...(data.settings[me]||{}),bio:String(p.bio||'').slice(0,160),avatar:safeUrl(p.avatar||''),banner:safeUrl(p.banner||''),private:!!p.private};saveLocal();return {success:true}}
case'sendMessage':{if(!p.receiverId||!String(p.text||'').trim())throw Error('宛先とメッセージを入力してください');const m={id:uid(),fromId:me,fromName:currentUser.name,toId:p.receiverId,toName:p.receiverName||p.receiverId,text:String(p.text).slice(0,4000),createdAt:now()};data.messages.unshift(m);notify(p.receiverId,'message',currentUser,'','新しいメッセージがあります');saveLocal();return {success:true,message:m}}
case'createList':{const l={id:uid(),userId:me,name:String(p.name||'').slice(0,60),description:String(p.description||'').slice(0,180),members:[],createdAt:now()};if(!l.name)throw Error('リスト名を入力してください');data.lists.unshift(l);saveLocal();return {success:true,list:l}}
case'listMember':{const l=data.lists.find(x=>x.id===p.listId&&x.userId===me);if(!l)throw Error('リストが見つかりません');l.members=l.members||[];if(l.members.includes(p.targetId))l.members=l.members.filter(x=>x!==p.targetId);else l.members.push(p.targetId);saveLocal();return {success:true}}
case'createCommunity':{const c={id:uid(),name:String(p.name||'').slice(0,60),description:String(p.description||'').slice(0,220),ownerId:me,members:[me],createdAt:now()};if(!c.name)throw Error('コミュニティ名を入力してください');data.communities.unshift(c);data.communityMembers.unshift({id:uid(),userId:me,communityId:c.id});saveLocal();return {success:true,community:c}}

function toggleExtra(k){composerExtras[k]=!composerExtras[k];$('composeExtras').hidden=!(composerExtras.media||composerExtras.poll||composerExtras.schedule||composerExtras.community);if(k==='media')$('mediaField').hidden=!composerExtras.media;if(k==='poll')$('pollFields').hidden=!composerExtras.poll;if(k==='schedule')$('scheduleField').hidden=!composerExtras.schedule;if(k==='community')$('communityField').hidden=!composerExtras.community;}
function updateCharCount(){const n=$('composeText')?.value.length||0;const el=$('charCount');if(el){el.textContent=n+' / 280';el.classList.toggle('warn',n>260)}}
function clearReply(){replyTo=null;if(composerBuffer)composerBuffer.replyTo=null;if($('replyIndicator'))$('replyIndicator').hidden=true}
function clearQuote(){quoteOf=null;if(composerBuffer)composerBuffer.quoteOf=null;if($('quoteIndicator'))$('quoteIndicator').hidden=true}
function primeReply(id){replyTo=id;quoteOf=null;if(composerBuffer)composerBuffer={...composerBuffer,replyTo:id,quoteOf:null};const p=(viewData.posts||[]).find(x=>x.id===id);goView('home');setTimeout(()=>{if($('replyIndicator')){$('replyIndicator').hidden=false;$('replyTargetText').textContent=p?'@'+p.userName:'投稿';$('composeText')?.focus()}},250)}
function primeQuote(id){quoteOf=id;replyTo=null;if(composerBuffer)composerBuffer={...composerBuffer,quoteOf:id,replyTo:null};goView('home');setTimeout(()=>{if($('quoteIndicator'))$('quoteIndicator').hidden=false;$('composeText')?.focus()},250)}
function toggleExtraAfterRender(){}
function submitPost(){const text=$('composeText')?.value.trim()||'';const mediaVisible=composerExtras.media;const media=mediaVisible?($('mediaInput').value||'').split(/[\n,]/).map(x=>safeUrl(x.trim())).filter(Boolean).slice(0,4):[];let poll=null;if(composerExtras.poll){const question=$('pollQuestion').value.trim();const options=$('pollOptions').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,4);if(question&&options.length>=2)poll={question,options:options.map(text=>({text,votes:[]}))};else if(question||options.length) return showToast('投票には質問と2〜4個の選択肢が必要です');}let scheduledAt='';if(composerExtras.schedule&&$('scheduleAt').value){scheduledAt=new Date($('scheduleAt').value).toISOString();if(new Date(scheduledAt)<=new Date())return showToast('予約日時は未来に設定してください');}if(!text&&!media.length&&!poll)return showToast('テキスト、メディア、投票のいずれかを追加してください');if(text.length>280)return showToast('投稿は280文字以内です');doAction('createPost',{text,media,poll,replyTo,quoteOf,scheduledAt,community:composerExtras.community?($('communityInput').value||'').trim():''}).then(r=>{if(r){clearComposer();refresh();}})}
function saveComposerDraft(){const text=$('composeText')?.value||'';const media=(($('mediaInput')?.value)||'').split(/[\n,]/).map(x=>safeUrl(x.trim())).filter(Boolean).slice(0,4);if(!text.trim()&&!media.length)return showToast('保存する下書きを入力してください');const scheduledAt=$('scheduleAt')?.value?new Date($('scheduleAt').value).toISOString():'';doAction('saveDraft',{text,media,scheduledAt}).then(r=>{if(r)showToast('下書きを保存しました')})}
function renderHome(){const f=(viewData.posts||[]).filter(p=>!p.draft);let tabs='';if(activeListId)tabs=`<div class="view-toolbar"><strong>☷ リストのタイムライン</strong><button class="follow-btn" onclick="clearTimelineFilter()">通常のタイムラインへ戻る</button></div>`;else if(activeCommunityName)tabs=`<div class="view-toolbar"><strong>♧ コミュニティ：${esc(activeCommunityName)}</strong><button class="follow-btn" onclick="clearTimelineFilter()">通常のタイムラインへ戻る</button></div>`;else tabs=feedMode==='for-you'?`<div class="feed-tabs"><button class="active" onclick="switchFeed('for-you')">おすすめ</button><button onclick="switchFeed('following')">フォロー中</button></div>`:`<div class="feed-tabs"><button onclick="switchFeed('for-you')">おすすめ</button><button class="active" onclick="switchFeed('following')">フォロー中</button></div>`;$('content').innerHTML=tabs+composeHtml()+renderPosts(f);}
function switchFeed(m){activeListId='';activeCommunityName='';feedMode=m;refresh()}
function clearTimelineFilter(){activeListId='';activeCommunityName='';feedMode='for-you';refresh()}
function viewList(id){activeListId=id;activeCommunityName='';feedMode='for-you';goView('home')}
function viewCommunity(name){activeCommunityName=name;activeListId='';feedMode='for-you';goView('home')}
function formatText(text){let s=esc(text);s=s.replace(/(https?:\/\/[^\s<]+)/g,url=>{const clean=safeUrl(url.replace(/[),.!?]+$/,''));return clean?`<a href="${esc(clean)}" target="_blank" rel="noopener noreferrer">${url}</a>`:url});s=s.replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu,'$1<a href="#" onclick="event.preventDefault();searchByTag(\'$2\')">$2</a>');s=s.replace(/(^|\s)(@[\w.-]+)/g,'$1<a href="#" onclick="event.preventDefault();openUserByHandle(\'$2\')">$2</a>');return s;}
function postById(id){return (viewData.posts||[]).find(p=>p.id===id)||(viewData.explorePosts||[]).find(p=>p.id===id)||null}
function renderPosts(posts){if(!posts.length)return `<div class="empty"><div class="empty-icon">🦇</div><h3>ここにはまだ投稿がありません</h3><p>最初のポストをしてみよう。<br>検索・フォロー中・ブックマークを切り替えてみてね。</p></div>`;return posts.map(p=>postHtml(p)).join('')}
function postHtml(p){const author=p.userName||p.authorName||p.userId||'ユーザー';const media=(p.media||[]).map(safeUrl).filter(Boolean);const replies=p.replyCount||0,likes=p.likeCount??p.likes??0,reposts=p.repostCount??p.reposts??0;const quote=p.quoteOf?postById(p.quoteOf):null;const poll=p.poll;const voted=!!p.pollVoted||((poll?.options||[]).some(o=>(o.votes||[]).includes(currentUser.id)));const total=(poll?.options||[]).reduce((n,o)=>n+(o.votes||[]).length,0);return `<article class="post" id="post-${esc(p.id)}"><div class="avatar" role="button" tabindex="0" onclick="openProfile(${jsq(p.userId)})" title="プロフィール">${esc(initials(author))}</div><div class="post-body"><div class="post-top"><div class="post-author"><div class="author-line"><button class="author-name" onclick="openProfile(${jsq(p.userId)})">${esc(author)}</button>${p.verified?'<span class="verify" title="認証済み">✓</span>':''}<span class="handle">@${esc(p.userId||'user')}</span><span class="post-time">· ${esc(relativeTime(p.createdAt))}</span>${p.scheduledAt?'<span class="pill">予約投稿</span>':''}</div>${p.replyTo?`<div class="small-muted">返信先 <button class="link-btn" onclick="jumpToPost(${jsq(p.replyTo)})">投稿を見る</button></div>`:''}</div><button class="post-more" onclick="postMenu(${jsq(p.id)})" title="その他">•••</button></div><div class="post-text">${formatText(p.text||'')}</div>${media.length?`<div class="post-media">${media.map(u=>/\.(mp4|webm|ogg)(?:$|[?#])/i.test(u)?`<video controls preload="metadata" src="${esc(u)}" style="width:100%;max-height:420px;background:#100b17"></video>`:`<img loading="lazy" src="${esc(u)}" alt="投稿メディア" onerror="this.style.display='none'">`).join('')}</div>`:''}${quote?`<div class="quote-card"><strong>${esc(quote.userName||quote.userId)} · 引用</strong><p>${formatText((quote.text||'').slice(0,400))}</p></div>`:p.quoteText?`<div class="quote-card"><strong>${esc(p.quoteAuthor||'引用投稿')}</strong><p>${formatText(p.quoteText)}</p></div>`:''}${poll?renderPoll(p,total,voted):''}${p.community?`<div class="small-muted">コミュニティ：${esc(p.community)}</div>`:''}<div class="post-actions"><button class="action-btn" onclick="primeReply(${jsq(p.id)})" title="返信">◯ <span>${replies||''}</span></button><button class="action-btn ${p.reposted?'active repost':''}" onclick="doAction('toggleRepost',{postId:${jsq(p.id)}})" title="リポスト">⟳ <span>${reposts||''}</span></button><button class="action-btn ${p.liked?'active like':''}" onclick="doAction('toggleLike',{postId:${jsq(p.id)}})" title="いいね">♡ <span>${likes||''}</span></button><button class="action-btn ${p.bookmarked?'active bookmark':''}" onclick="doAction('toggleBookmark',{postId:${jsq(p.id)}})" title="ブックマーク">♢</button><button class="action-btn" onclick="primeQuote(${jsq(p.id)})" title="引用">❞</button><button class="action-btn" onclick="sharePost(${jsq(p.id)})" title="共有">↗</button>${p.userId===currentUser.id?`<button class="action-btn" onclick="deletePost(${jsq(p.id)})" title="削除">⌫</button>`:''}</div></div></article>`}
function renderPoll(p,total,voted){const opts=p.poll.options||[];return `<div class="poll-card"><div class="poll-question">${esc(p.poll.question)}</div>${opts.map((o,i)=>{const n=(o.votes||[]).length;const pct=total?Math.round(n/total*100):0;return `<button class="poll-option ${((o.votes||[]).includes(currentUser.id))?'chosen':''}" ${voted?'disabled':''} onclick="vote(${jsq(p.id)},${i})"><div class="poll-fill" style="width:${voted?pct:0}%"></div><span>${esc(o.text)} ${voted?`<b style="float:right">${pct}%</b>`:''}</span></button>`}).join('')}<div class="poll-foot">${total} 票 · ${voted?'投票済み':'選択して投票'}</div></div>`}
function vote(postId,optionIndex){doAction('votePoll',{postId,optionIndex})}
function openProfile(id){profileTarget=id;goView('profile')}
function openUserByHandle(handle){const id=handle.replace(/^@/,'');const u=(viewData.users||{})[id];openProfile(u?.id||id)}
function jumpToPost(id){const p=postById(id);if(p){feedMode='for-you';activeListId='';activeCommunityName='';goView('home');setTimeout(()=>document.getElementById('post-'+CSS.escape(id))?.scrollIntoView({behavior:'smooth',block:'center'}),350)}else showToast('元の投稿は見つかりませんでした')}
async function sharePost(id){const p=postById(id);const url=new URL(location.href);url.hash='post-'+id;const text=(p?.text||'modoku SNSの投稿')+'\n'+url.href;try{if(navigator.share)await navigator.share({title:'modoku SNS',text,url:url.href});else{await navigator.clipboard.writeText(text);showToast('投稿リンクをコピーしました')}}catch(e){if(e.name!=='AbortError')showToast('共有できませんでした')}}
function postMenu(id){const p=postById(id);if(!p)return;const own=p.userId===currentUser.id;modal(`<h2>投稿のメニュー</h2><p class="small-muted">@${esc(p.userId)}</p>${own?`<label class="field-label">投稿本文を編集</label><textarea class="field field-area" id="editPostText" maxlength="280">${esc(p.text||'')}</textarea><div class="modal-actions"><button class="primary-btn" onclick="savePostEdit(${jsq(id)})">変更を保存</button><button class="danger-btn" onclick="closeModal();deletePost(${jsq(id)})">投稿を削除</button></div>`:`<label class="field-label">通報理由</label><select class="field" id="reportReason"><option>スパム</option><option>嫌がらせ・いじめ</option><option>危険な内容</option><option>なりすまし</option><option>その他</option></select><div class="modal-actions"><button class="danger-btn" onclick="reportPost(${jsq(id)},${jsq(p.userId)})">通報</button><button class="follow-btn" onclick="closeModal();doAction('mute',{targetId:${jsq(p.userId)}})">ミュート</button><button class="danger-btn" onclick="closeModal();doAction('block',{targetId:${jsq(p.userId)}})">ブロック</button></div>`}<div class="modal-actions"><button class="follow-btn" onclick="closeModal()">閉じる</button></div>`)}
function modal(content){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function reportPost(postId,targetId){const reason=$('reportReason')?.value||'その他';closeModal();doAction('report',{postId,targetId,reason}).then(r=>{if(r)showToast('通報しました。管理者が確認できるよう記録しました。')})}
function savePostEdit(postId){const text=$('editPostText').value;if(text.length>280)return showToast('投稿は280文字以内です');closeModal();doAction('updatePost',{postId,text})}
function deletePost(postId){if(!confirm('この投稿を削除しますか？'))return;doAction('deletePost',{postId})}
function searchByTag(tag){searchTerm=tag;$('globalSearch').value=tag;goView('explore')}
function renderExplore(){const term=(searchTerm||$('globalSearch').value||'').trim().toLowerCase();const all=viewData.explorePosts||viewData.posts||[];const hits=all.filter(p=>(`${p.text||''} ${p.userName||''} ${p.userId||''}`).toLowerCase().includes(term));const users=Object.values(viewData.users||{}).filter(u=>!term||(`${u.name} ${u.id} ${u.bio||''}`).toLowerCase().includes(term));$('content').innerHTML=`<div class="view-toolbar"><input class="field" id="exploreQuery" value="${esc(searchTerm||$('globalSearch').value)}" placeholder="キーワード、@ユーザー、#タグ"><button class="primary-btn" onclick="runExplore()">検索</button></div><div class="page-pad"><div class="panel"><h3>ユーザー</h3>${users.slice(0,8).map(u=>`<div class="suggestion"><div class="avatar small">${esc(initials(u.name))}</div><div class="suggestion-name"><strong>${esc(u.name)}</strong><span>@${esc(u.id)}</span></div><button class="follow-btn" onclick="openProfile(${jsq(u.id)})">プロフィール</button></div>`).join('')||'<div class="small-muted">ユーザーが見つかりません。</div>'}</div></div><div class="page-pad" style="padding-top:0"><h3>投稿 ${hits.length} 件</h3></div>${renderPosts(term?hits:all)}`;}
function runExplore(){searchTerm=$('exploreQuery').value.trim();$('globalSearch').value=searchTerm;renderExplore()}
function renderNotifications(){const ns=viewData.notifications||[];const labels={like:'あなたの投稿にいいねしました',repost:'あなたの投稿をリポストしました',reply:'あなたの投稿に返信しました',follow:'あなたをフォローしました',mention:'投稿であなたに言及しました',message:'新しいメッセージがあります'};$('content').innerHTML=`<div class="view-toolbar"><span class="small-muted">最新の通知を表示しています</span><button class="follow-btn" onclick="doAction('markNotificationsRead',{})">すべて既読にする</button></div>${ns.map(n=>`<div class="notice ${n.read?'':'unread'}" onclick="${n.postId?`jumpToPost(${jsq(n.postId)})`:n.type==='message'?`goView('messages')`:`openProfile(${jsq(n.actorId)})`}"><div class="avatar small">${esc(initials(n.actorName))}</div><div class="notice-text"><strong>${esc(n.actorName||'ユーザー')}</strong> ${esc(n.text||labels[n.type]||'アクティビティがありました')}<time>${esc(relativeTime(n.createdAt))}</time></div></div>`).join('')||'<div class="empty"><div class="empty-icon">♧</div><h3>通知はまだありません</h3><p>誰かがあなたに反応すると、ここに表示されます。</p></div>'}`}
function renderBookmarks(){const ids=new Set(viewData.bookmarkIds||[]);$('content').innerHTML=renderPosts(viewData.bookmarkedPosts||(viewData.posts||[]).filter(p=>ids.has(p.id)||p.bookmarked))}
function renderProfile(){const p=viewData.profile||{};const profId=profileTarget||currentUser.id;const me=profId===currentUser.id;const following=(viewData.followingIds||[]).includes(profId);const posts=(p.posts||[]).filter(x=>!x.replyTo);const avatar=p.avatar&&safeUrl(p.avatar)?`<img class="avatar large" src="${esc(safeUrl(p.avatar))}" alt="avatar">`:`<div class="avatar large">${esc(initials(p.name))}</div>`;$('content').innerHTML=`<div class="page-pad"><div class="panel"><div class="profile-cover" style="${p.banner&&safeUrl(p.banner)?`background-image:linear-gradient(#140c2088,#140c2088),url(${jsq(safeUrl(p.banner))});background-size:cover;background-position:center`:''}"></div><div class="profile-head">${avatar}<div>${me?`<button class="follow-btn" onclick="goView('settings')">プロフィールを編集</button>`:`<button class="primary-btn" onclick="doAction('follow',{targetId:${jsq(profId)}})">${following?'フォロー中':'フォロー'}</button> <button class="follow-btn" onclick="startDM(${jsq(profId)},${jsq(p.name||profId)})">メッセージ</button>`}</div></div><div class="profile-bio"><h2>${esc(p.name||profId)}</h2><div class="handle">@${esc(profId)} ${p.private?'· 🔒 非公開アカウント':''}</div><p>${esc(p.bio||'自己紹介はまだありません。')}</p><div class="profile-stats"><span><strong>${p.following||0}</strong> フォロー中</span><span><strong>${p.followers||0}</strong> フォロワー</span><span><strong>${posts.length}</strong> 投稿</span></div></div></div><div class="profile-tabs"><button class="active">投稿</button><button onclick="showToast('返信タブは今後の拡張候補です')">返信</button><button onclick="showToast('メディアタブは投稿一覧から確認できます')">メディア</button><button onclick="showToast('いいね一覧は非公開です')">いいね</button></div></div>${renderPosts(posts)}`}
function renderMessages(){const msgs=viewData.messages||[];const ids=new Map();msgs.forEach(m=>{const other=m.fromId===currentUser.id?m.toId:m.fromId;if(!ids.has(other))ids.set(other,{id:other,name:m.fromId===currentUser.id?(m.toName||other):(m.fromName||other),last:m})});if(dmTarget&&!ids.has(dmTarget))ids.set(dmTarget,{id:dmTarget,name:dmTarget,last:null});const conv=[...ids.values()].sort((a,b)=>new Date(b.last?.createdAt||0)-new Date(a.last?.createdAt||0));const active=dmTarget||conv[0]?.id||'';if(!dmTarget&&active)dmTarget=active;const selected=conv.find(c=>c.id===active);const chat=msgs.filter(m=>(m.fromId===currentUser.id&&m.toId===active)||(m.fromId===active&&m.toId===currentUser.id));$('content').innerHTML=`<div class="view-toolbar"><button class="primary-btn" onclick="newDMModal()">＋ 新しいメッセージ</button></div><div class="message-layout"><div class="conversation-list">${conv.map(c=>`<div class="conversation ${c.id===active?'active':''}" onclick="selectDM(${jsq(c.id)})"><div class="avatar small">${esc(initials(c.name))}</div><div style="min-width:0"><div class="conversation-name">${esc(c.name)}</div><div class="conversation-preview">${esc(c.last?.text||'会話を開始')}</div></div></div>`).join('')||'<div class="small-muted" style="padding:12px">まだ会話がありません。</div>'}</div><div class="chat-panel"><div class="chat-head">${selected?esc(selected.name):active?esc(active):'会話を選択してください'}</div><div class="chat-log" id="chatLog">${chat.map(m=>`<div class="bubble ${m.fromId===currentUser.id?'mine':''}">${esc(m.text)}<small>${esc(relativeTime(m.createdAt))}</small></div>`).join('')||'<div class="small-muted">ここからメッセージを送れます。</div>'}</div><form class="chat-form" onsubmit="sendDM(event,${jsq(active)},${jsq(selected?.name||active)})"><input class="field" id="dmText" maxlength="4000" placeholder="メッセージを入力…" ${active?'':'disabled'}><button class="primary-btn" ${active?'':'disabled'}>送信</button></form></div></div>`;const log=$('chatLog');if(log)log.scrollTop=log.scrollHeight}
function selectDM(id){dmTarget=id;refresh()}
function startDM(id,name){dmTarget=id;goView('messages')}
function newDMModal(){modal(`<h2>新しいメッセージ</h2><label class="field-label">相手のユーザーID</label><input class="field" id="newDMId" placeholder="ユーザーID"><div class="modal-actions"><button class="follow-btn" onclick="closeModal()">キャンセル</button><button class="primary-btn" onclick="beginNewDM()">会話を開く</button></div>`)}
function beginNewDM(){const id=$('newDMId').value.trim().replace(/^@/,'');if(!id)return showToast('ユーザーIDを入力してください');closeModal();dmTarget=id;goView('messages')}
function sendDM(e,id,name){e.preventDefault();const text=$('dmText')?.value.trim();if(!id||!text)return;doAction('sendMessage',{receiverId:id,receiverName:name,text}).then(r=>{if(r){dmTarget=id;refresh()}})}
function renderLists(){const lists=viewData.lists||[];$('content').innerHTML=`<div class="page-pad"><form class="panel" onsubmit="createList(event)"><h3>＋ リストを作成</h3><label class="field-label">リスト名</label><input class="field" id="listName" maxlength="60" placeholder="例：ゲーム開発者"><label class="field-label">説明</label><input class="field" id="listDesc" maxlength="180" placeholder="このリストについて"><button class="primary-btn" style="margin-top:12px">作成</button></form><div class="panel"><h3>あなたのリスト</h3>${lists.map(l=>`<div class="list-row"><div><strong>${esc(l.name)}</strong><p>${esc(l.description||'説明なし')} · ${(l.members||[]).length} 人</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="follow-btn" onclick="viewList(${jsq(l.id)})">表示</button><button class="follow-btn" onclick="editListMembers(${jsq(l.id)})">メンバー</button></div></div>`).join('')||'<div class="small-muted">リストはまだありません。</div>'}</div></div>`}
function createList(e){e.preventDefault();doAction('createList',{name:$('listName').value.trim(),description:$('listDesc').value.trim()})}
function editListMembers(listId){modal(`<h2>メンバーを追加</h2><p class="small-muted">ユーザーIDを入力して追加・削除できます。</p><input class="field" id="listMemberId" placeholder="ユーザーID"><div class="modal-actions"><button class="follow-btn" onclick="closeModal()">閉じる</button><button class="primary-btn" onclick="doAction('listMember',{listId:${jsq(listId)},targetId:$('listMemberId').value.trim()}).then(closeModal)">切り替え</button></div>`)}
function renderCommunities(){const cs=viewData.communities||[];const joined=new Set(viewData.joinedCommunities||[]);$('content').innerHTML=`<div class="page-pad"><form class="panel" onsubmit="createCommunity(event)"><h3>＋ コミュニティを作成</h3><label class="field-label">名前</label><input class="field" id="communityName" maxlength="60" placeholder="例：レトロゲーム部"><label class="field-label">説明</label><textarea class="field field-area" id="communityDesc" maxlength="220" placeholder="どんな人が集まる場所？"></textarea><button class="primary-btn" style="margin-top:12px">作成</button></form><div class="community-grid">${cs.map(c=>`<div class="community-card"><h3>🎃 ${esc(c.name)}</h3><p>${esc(c.description||'説明はありません')}</p><div class="community-meta">${c.members||0} メンバー</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="follow-btn" onclick="viewCommunity(${jsq(c.name)})">投稿を見る</button><button class="follow-btn" onclick="doAction('joinCommunity',{communityId:${jsq(c.id)}})">${joined.has(c.id)?'参加中 · 退出':'参加する'}</button></div></div>`).join('')||'<div class="empty">コミュニティはまだありません。</div>'}</div></div>`}
function createCommunity(e){e.preventDefault();doAction('createCommunity',{name:$('communityName').value.trim(),description:$('communityDesc').value.trim()})}
function renderSettings(){const s=viewData.settings||{};const apiUrl=configuredApiUrl();$('content').innerHTML=`<div class="page-pad"><form class="panel" onsubmit="saveProfile(event)"><h3>プロフィール</h3><label class="field-label">自己紹介（160文字以内）</label><textarea class="field field-area" id="profileBio" maxlength="160" placeholder="好きなもの、作っているものなど">${esc(s.bio||'')}</textarea><label class="field-label">アバター画像 URL</label><input class="field" id="profileAvatar" value="${esc(s.avatar||'')}" placeholder="https://…"><label class="field-label">ヘッダー画像 URL</label><input class="field" id="profileBanner" value="${esc(s.banner||'')}" placeholder="https://…"><label style="display:flex;gap:8px;align-items:center;margin-top:13px;font-size:13px"><input type="checkbox" id="profilePrivate" ${s.private?'checked':''} style="width:auto"> 非公開アカウント（フォローしていないユーザーの投稿をタイムラインから隠します）</label><button class="primary-btn" style="margin-top:15px">プロフィールを保存</button></form><div class="panel"><h3>全員共通のSNS接続</h3><p class="small-muted">SNSの接続先はサイト全体で共通です。利用者ごとのURL入力やアクセスキーは不要です。管理者が一度だけ sns-config.js の MODOKU_SNS_API_URL に共有APIの /exec URL を設定してサイトを再公開します。</p><div class="status-line">${apiUrl?'共有API URL：設定済み。接続状態は画面上部の表示で確認できます。':'共有API URL：未設定。今はこのブラウザー内だけのローカル保存です。'}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button type="button" class="follow-btn" onclick="testApi()">共有サーバー接続テスト</button><button type="button" class="follow-btn" onclick="location.href='sns-backend/SETUP.md'">管理者向け設定手順</button></div><div class="status-line">注意：ログイン状態は現在のmodoku-wの userId / userName を利用します。現行掲示板と同様、クライアント側のIDだけでは強固な本人確認にならないため、外部公開前にサーバー側認証の強化を推奨します。</div></div><div class="panel"><h3>アカウント</h3><p class="small-muted">ログイン中：${esc(currentUser.name)}（${esc(currentUser.id)}）</p><button class="follow-btn" onclick="location.href='main.html'">アカウント管理へ</button> <button class="follow-btn" onclick="location.href='login.html'">ログイン画面</button></div><div class="panel"><h3>ミュート・ブロックしたユーザー</h3><p class="small-muted">ここからいつでも解除できます。</p><div class="list-row"><div><strong>ブロック</strong><p>${(viewData.blockedIds||[]).map(esc).join('、')||'なし'}</p></div><div style="display:flex;gap:5px;flex-wrap:wrap">${(viewData.blockedIds||[]).map(id=>`<button class="follow-btn" onclick="doAction('block',{targetId:${jsq(id)}})">${esc(id)} を解除</button>`).join('')}</div></div><div class="list-row"><div><strong>ミュート</strong><p>${(viewData.mutedIds||[]).map(esc).join('、')||'なし'}</p></div><div style="display:flex;gap:5px;flex-wrap:wrap">${(viewData.mutedIds||[]).map(id=>`<button class="follow-btn" onclick="doAction('mute',{targetId:${jsq(id)}})">${esc(id)} を解除</button>`).join('')}</div></div></div><div class="panel"><h3>ローカルデータ</h3><p class="small-muted">この端末のデモ投稿・設定のみを初期化します。共有サーバーのデータには影響しません。</p><button class="danger-btn" onclick="resetLocalData()">この端末のSNSデータを初期化</button></div></div>`}

function saveProfile(e){e.preventDefault();const av=$('profileAvatar').value.trim(),ban=$('profileBanner').value.trim();if(av&&!safeUrl(av)||ban&&!safeUrl(ban))return showToast('画像URLは http または https で入力してください');doAction('saveProfile',{bio:$('profileBio').value,avatar:av,banner:ban,private:$('profilePrivate').checked})}
async function testApi(){const url=configuredApiUrl();if(!url)return showToast('共有API未設定です。管理者が sns-config.js を設定してください。');try{const h=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'health'})});if(!h.ok)throw new Error('HTTP '+h.status);const health=await h.json();if(!health.success)throw new Error('API応答を確認できません');if(currentUser.id!=='local-demo-user')await api('snapshot',{});showToast('共有SNS APIへの接続を確認しました');await refresh()}catch(e){showToast(e.message||'接続テスト失敗')}}
function resetLocalData(){if(!confirm('この端末のSNSデータを初期化しますか？'))return;localStorage.removeItem(STORAGE_KEY);data=loadLocal();showToast('ローカルデータを初期化しました');refresh()}
function renderScheduled(){const drafts=viewData.drafts||[];const future=(viewData.scheduledPosts||[]).filter(p=>p.scheduledAt&&new Date(p.scheduledAt)>new Date()&&p.userId===currentUser.id);$('content').innerHTML=`<div class="page-pad"><div class="panel"><h3>予約投稿</h3>${future.map(p=>`<div class="list-row"><div><strong>${esc(p.text||'（メディア・投票のみ）')}</strong><p>${esc(new Date(p.scheduledAt).toLocaleString('ja-JP'))}</p></div><button class="danger-btn" onclick="deletePost(${jsq(p.id)})">削除</button></div>`).join('')||'<p class="small-muted">予約投稿はありません。</p>'}</div><div class="panel"><h3>下書き</h3>${drafts.map(d=>`<div class="list-row"><div><strong>${esc((d.text||'（メディア）').slice(0,80))}</strong><p>${esc(relativeTime(d.createdAt))}</p></div><div style="display:flex;gap:6px"><button class="follow-btn" onclick="loadDraft(${jsq(d.id)})">編集</button><button class="danger-btn" onclick="deleteDraft(${jsq(d.id)})">削除</button></div></div>`).join('')||'<p class="small-muted">下書きはありません。</p>'}</div></div>`}
function loadDraft(id){const d=(viewData.drafts||[]).find(x=>x.id===id);if(!d)return;goView('home');setTimeout(()=>{if($('composeText')){$('composeText').value=d.text||'';if(d.media?.length){toggleExtra('media');$('mediaInput').value=d.media.join('\n')}updateCharCount();showToast('下書きを編集欄に読み込みました。送信後、下書きは自動削除されません。')}},250)}
function deleteDraft(id){doAction('deleteDraft',{draftId:id})}
function renderTrends(){const trends=viewData.trends||[];$('trends').innerHTML=trends.map(t=>`<div class="trend" onclick="searchByTag(${jsq(t.tag)})"><span>トレンド · ハロウィンの夜</span><strong>${esc(t.tag)}</strong><span>${t.count} 件の投稿</span></div>`).join('')||'<div class="small-muted">投稿にハッシュタグを付けると、ここに表示されます。</div>'}
function renderSuggestions(){const users=Object.values(viewData.users||{}).filter(u=>u.id!==currentUser.id).slice(0,5);const follows=new Set(viewData.followingIds||[]);$('suggestions').innerHTML=users.map(u=>`<div class="suggestion"><div class="avatar small">${esc(initials(u.name))}</div><div class="suggestion-name"><strong>${esc(u.name)}</strong><span>@${esc(u.id)}</span></div><button class="follow-btn ${follows.has(u.id)?'following':''}" onclick="doAction('follow',{targetId:${jsq(u.id)}})">${follows.has(u.id)?'中':'フォロー'}</button></div>`).join('')||'<div class="small-muted">ユーザーが増えると、ここにおすすめが表示されます。</div>'}
async function loadInitial(){data=loadLocal();try{await refresh()}catch(e){data=loadLocal();Object.assign(viewData,localSnapshot());render()}updateHeader()}
window.addEventListener('load',loadInitial);
setInterval(()=>{if(!document.hidden&&configuredApiUrl())refresh()},30000);
// Adobe Fonts のロードに合わせる
(function(){const apply=()=>{try{const faces=Array.from(document.fonts||[]);const ignored=/^(Arial|Helvetica|Helvetica Neue|Times New Roman|Courier New|serif|sans-serif|DotGothic16|Noto Sans JP)$/i;const family=faces.map(f=>String(f.family||'').replace(/^['"]|['"]$/g,'').trim()).find(n=>n&&!ignored.test(n));if(family)document.documentElement.style.setProperty('--brand-font','"'+family.replace(/["\\]/g,'')+'", "Yu Gothic UI", Meiryo, sans-serif')}catch(e){}};const kit=$('adobe-typekit-fonts');if(kit)kit.addEventListener('load',apply,{once:true});if(document.fonts?.ready)document.fonts.ready.then(apply);})();
</script>
</body>
